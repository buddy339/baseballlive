<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台总览 · 棒球记分牌</title>
<style>
  :root {
    --bg: #0a181f; --card: #0f2129; --line: #1e3d49;
    --cyan: #25c7d9; --cyan-l: #7fe7f7; --yellow: #ffd24d;
    --txt: #d7edf3; --dim: #6f97a3; --green: #5ad19a; --red: #ff7a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--txt); padding: 14px;
    max-width: 960px; margin: 0 auto;
  }
  h1 { font-size: 18px; color: var(--cyan-l); margin-bottom: 4px; }
  h1 small { font-size: 12px; color: var(--dim); font-weight: normal; margin-left: 8px; }
  .sub { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; font-size: 12px; color: var(--dim);
  }
  .chip b { display: block; font-size: 16px; color: var(--cyan-l); margin-top: 2px; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 5px; vertical-align: 1px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 12px;
  }
  .card h2 { font-size: 14px; color: var(--cyan); margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: normal; }
  td b { color: var(--yellow); }
  .gid { color: var(--cyan-l); font-weight: bold; }
  .lnk { color: var(--cyan); text-decoration: none; margin-right: 8px; }
  .lnk:hover { text-decoration: underline; }
  button.mini {
    background: transparent; border: 1px solid rgba(127,231,247,.35); color: var(--cyan-l);
    border-radius: 8px; padding: 4px 10px; font-size: 11px; cursor: pointer; margin-right: 4px;
  }
  button.mini:hover { background: rgba(37,199,217,.12); }
  .twrap { overflow-x: auto; }
  .team { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .team .tname { font-size: 13px; font-weight: bold; color: var(--yellow); margin-bottom: 6px; }
  .team .tname span { color: var(--dim); font-weight: normal; font-size: 11px; margin-left: 6px; }
  .team .plist { font-size: 12px; color: var(--txt); line-height: 1.9; }
  .team .plist i { font-style: normal; background: #0c1c22; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; margin-right: 6px; display: inline-block; margin-bottom: 4px; }
  .empty { color: var(--dim); font-size: 12px; padding: 10px 0; }
  .backrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .backrow button {
    background: #14303a; border: 1px solid var(--line); color: var(--cyan-l);
    border-radius: 10px; padding: 9px 14px; font-size: 12px; cursor: pointer;
  }
  .backrow button:hover { border-color: var(--cyan); }
  .foot { text-align: center; color: var(--dim); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>

<h1>棒球记分牌 · 后台总览<small id="clock"></small></h1>
<div class="sub">每 5 秒自动刷新 · 此页只读查看与备份，不影响比赛进行</div>

<div class="chips" id="chips"></div>

<div class="card">
  <h2>场地一览</h2>
  <div class="twrap">
    <table>
      <thead><tr>
        <th>场地</th><th>对阵（客 vs 主）</th><th>比分</th><th>局数</th><th>年龄段</th>
        <th>在线</th><th>最后操作</th><th>快捷入口</th>
      </tr></thead>
      <tbody id="gameRows"></tbody>
    </table>
  </div>
</div>

<div class="card">
  <h2>队伍库（<span id="teamCount">0</span> 支球队）</h2>
  <div id="teamList"></div>
</div>

<div class="card">
  <h2>数据备份</h2>
  <div class="backrow">
    <button id="bkAll">下载全部备份（队伍库 + 各场状态）</button>
    <button id="bkTeams">仅下载队伍库</button>
  </div>
</div>

<div class="foot">棒球记分牌直播系统 · 后台总览</div>

<script>
const $ = (id) => document.getElementById(id);
let lastData = null;

function fmtUptime(ms) {
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d} 天 ${h} 小时`;
  if (h) return `${h} 小时 ${m} 分`;
  return `${m} 分 ${s % 60} 秒`;
}
function fmtAgo(ts, now) {
  if (!ts) return '—';
  const s = Math.max(0, Math.floor((now - ts) / 1000));
  if (s < 60) return s + ' 秒前';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function download(fname, text, type) {
  const blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function stamp() {
  const n = new Date(), p = (x) => String(x).padStart(2, '0');
  return `${n.getFullYear()}${p(n.getMonth() + 1)}${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}`;
}

async function refresh() {
  let d;
  try {
    const r = await fetch('/api/overview');
    d = await r.json();
  } catch (e) { return; }
  if (!d || !d.ok) return;
  lastData = d;

  const up = fmtUptime(d.now - d.startedAt);
  const teamNames = Object.keys(d.teams || {});
  const playersOf = (t) => (Array.isArray(t) ? t : (t && t.players) || []);
  const groupOf = (t) => (!Array.isArray(t) && t && t.group) || '';
  const plabel = (p) => {
    if (p && typeof p === 'object') return (p.no ? p.no + ' ' : '') + (p.name || '');
    return String(p || '');
  };
  const playerTotal = teamNames.reduce((a, k) => a + playersOf(d.teams[k]).length, 0);
  $('clock').textContent = new Date(d.now).toLocaleString('zh-CN', { hour12: false });
  $('chips').innerHTML =
    `<div class="chip"><span class="dot"></span>服务状态<b>运行中</b></div>` +
    `<div class="chip">已运行<b>${esc(up)}</b></div>` +
    `<div class="chip">端口<b>${d.port}</b></div>` +
    `<div class="chip">活跃场地<b>${d.games.length}</b></div>` +
    `<div class="chip">队伍库<b>${teamNames.length} 队 / ${playerTotal} 人</b></div>`;

  // 场地表
  if (!d.games.length) {
    $('gameRows').innerHTML = '<tr><td colspan="8" class="empty">暂无场地数据</td></tr>';
  } else {
    $('gameRows').innerHTML = d.games.map((g) => {
      const away = g.teams[1] || '客队', home = g.teams[0] || '主队';
      const half = g.half === 0 ? '上' : '下';
      const idle = !g.lastUpdate;
      return `<tr>
        <td class="gid">${esc(g.id)} 号场</td>
        <td>${esc(away)} vs ${esc(home)}</td>
        <td><b>${g.score[0]} : ${g.score[1]}</b></td>
        <td>${g.inning} 局${half} / 共${g.innings}局</td>
        <td>${esc(g.ageGroup || '—')}</td>
        <td>${g.online} 端</td>
        <td>${idle ? '—' : esc(fmtAgo(g.lastUpdate, d.now))}</td>
        <td>
          <a class="lnk" href="/g/${encodeURIComponent(g.id)}/" target="_blank">控制端</a><a class="lnk" href="/g/${encodeURIComponent(g.id)}/board" target="_blank">挂件</a><button class="mini" data-g="${esc(g.id)}">导出CSV</button>
        </td>
      </tr>`;
    }).join('');
    document.querySelectorAll('button.mini[data-g]').forEach((b) => {
      b.addEventListener('click', () => exportGame(b.getAttribute('data-g')));
    });
  }

  // 队伍库
  $('teamCount').textContent = teamNames.length;
  if (!teamNames.length) {
    $('teamList').innerHTML = '<div class="empty">队伍库为空，可在控制端「扫码/更多 → 队伍库」录入</div>';
  } else {
    $('teamList').innerHTML = teamNames.map((name) => {
      const t = d.teams[name];
      const players = playersOf(t);
      const g = groupOf(t);
      return `<div class="team">
        <div class="tname">${esc(name)}${g ? ` <span style="color:var(--cyan)">［${esc(g)}］</span>` : ''}<span>${players.length} 人</span></div>
        <div class="plist">${players.map((p) => `<i>${esc(plabel(p))}</i>`).join('')}</div>
      </div>`;
    }).join('');
  }
}

async function exportGame(gid) {
  try {
    const r = await fetch(`/g/${encodeURIComponent(gid)}/api/export`, { method: 'POST' });
    const d = await r.json();
    if (d && d.ok && d.csv) download(d.fname || `比赛数据_${gid}号场.csv`, d.csv, 'text/csv;charset=utf-8');
    else alert('导出失败：' + (d && d.error || '未知错误'));
  } catch (e) { alert('导出失败：' + e.message); }
}

$('bkAll').addEventListener('click', () => {
  if (!lastData) return;
  download(`记分牌备份_${stamp()}.json`, JSON.stringify({
    备份时间: new Date().toLocaleString('zh-CN', { hour12: false }),
    队伍库: lastData.teams,
    场地概览: lastData.games
  }, null, 2));
});
$('bkTeams').addEventListener('click', () => {
  if (!lastData) return;
  download(`队伍库备份_${stamp()}.json`, JSON.stringify(lastData.teams, null, 2));
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
